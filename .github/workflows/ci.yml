name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly audit so advisories published against pinned deps surface
    # even when nothing is being pushed.
    - cron: '0 12 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - run: npx astro check

      - run: npm run build
