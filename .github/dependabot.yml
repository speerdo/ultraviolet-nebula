version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 conflicts with @astrojs/check (peer: ^5.0.0 || ^6.0.0).
      # Remove once @astrojs/check publishes TS 7 support.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      astro:
        patterns:
          - astro
          - "@astrojs/*"
      dev-dependencies:
        dependency-type: development
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
